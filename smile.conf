server {
    listen 80;
    server_name 148.230.97.130 aseskan.com;

    # Logs
    access_log /var/log/nginx/smile_access.log;
    error_log /var/log/nginx/smile_error.log;

    # ==============================
    # APK Download
    # ==============================
    location /download/ {
        alias /var/www/smile/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
        
        location ~* \.(apk)$ {
             add_header Content-Type application/vnd.android.package-archive;
             add_header Content-Disposition 'attachment; filename="smile-insurance.apk"';
        }
    }

    # ==============================
    # API Backend
    # ==============================
    location /api/ {
        proxy_pass http://unix:/var/www/smile/smile.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================
    # Django Admin
    # ==============================
    location /admin/ {
        proxy_pass http://unix:/var/www/smile/smile.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================
    # Static files
    # ==============================
    location /static/ {
        alias "/var/www/smile/Smile Project/staticfiles/";
    }

    # ==============================
    # Media files
    # ==============================
    location /media/ {
        alias "/var/www/smile/Smile Project/media/";
    }

    # ==============================
    # Admin Dashboard (React App)
    # ==============================
    location ^~ /dashboard {
        alias /var/www/smile/admin-dashboard-build;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # ==============================
    # Customer Website (React App) - Root
    # ==============================
    location / {
        root /var/www/smile/customer-website-build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
